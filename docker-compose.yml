services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: listable
      POSTGRES_PASSWORD: listable
      POSTGRES_DB: listable
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U listable -d listable"]
      interval: 5s
      timeout: 5s
      retries: 12
    ports:
      - "5433:5432"

  api:
    build: ./api
    environment:
      DATABASE_URL: postgres://listable:listable@db:5432/listable
      PORT: 43124
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "43124:43124"

  web:
    build: ./web
    depends_on:
      - api
    ports:
      - "43123:80"

volumes:
  pgdata:
